# azure-pipelines.yml

trigger:
  branches:
    include:
      - dev   # 👈 pipeline runs automatically on push to dev branch

pool:
  vmImage: 'ubuntu-latest'   # 👈 use Microsoft-hosted agent

steps:
# Step 1: Display build start
- script: echo "🚀 Starting build and deployment..."
  displayName: "Start Build"

# Step 2: Copy code to Azure VM via SSH
- task: CopyFilesOverSSH@0
  displayName: "Deploy code to Azure VM"
  inputs:
    sshEndpoint: 'azure-ssh'   # 👈 must match the service connection name
    sourceFolder: '$(Build.SourcesDirectory)'  # code from repo
    contents: '**'                  # copy everything
    targetFolder: '/var/www/helloworld'  # destination on VM
